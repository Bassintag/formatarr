version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    labels:
      - type:chore
      - area:infra
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - type:chore
      - area:infra
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns:
          - "*"
